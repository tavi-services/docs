<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-labelledby="title"><title id="title">Approval of the work scope and spending limit</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#70887e" stroke-width="1.3"/></marker></defs><rect width="960" height="390" rx="16" fill="#f5f8f5"/><path d="M240 180 L325 180" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M535 160 L655 102" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M535 200 L655 290" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="25" y="135" width="215" height="90" rx="10" fill="#ffffff" stroke="#d4dfd6"/><text x="132.5" y="174.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#263c32">Approved scope</text><text x="132.5" y="198.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#263c32">And spending limit</text><rect x="325" y="135" width="210" height="90" rx="10" fill="#0b6753" stroke="#0b6753"/><text x="430.0" y="174.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#ffffff">Within approval?</text><text x="430.0" y="198.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#ffffff">Scope and total cost</text><rect x="655" y="65" width="275" height="75" rx="10" fill="#e2f0e7" stroke="#bdd5c5"/><text x="792.5" y="96.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#164c3a">Yes: carry out work</text><text x="792.5" y="120.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#164c3a">Record the cost</text><rect x="655" y="245" width="275" height="90" rx="10" fill="#fff3d9" stroke="#e3c788"/><text x="792.5" y="272.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#775515">No: request approval</text><text x="792.5" y="296.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#775515">Explain scope + price change</text><text x="792.5" y="320.0" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#775515">Wait for a decision</text><text x="25" y="35" fill="#53675e" font-family="system-ui,sans-serif" font-size="14" font-weight="600">GET APPROVAL BEFORE ADDITIONAL WORK OR SPENDING</text><text x="25" y="365" fill="#53675e" font-family="system-ui,sans-serif" font-size="14" font-weight="600">After approval, Tavi proceeds within the updated scope and spending limit.</text></svg>