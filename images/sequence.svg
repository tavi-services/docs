<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" role="img" aria-labelledby="flow-title flow-desc">
<title id="flow-title">Work-order handoff and updates</title><desc id="flow-desc">The partner submits a work order and receives its ID. Tavi coordinates fulfillment, sends a signed status event, and serves the latest state when the partner fetches it.</desc>
<defs><marker id="green" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#167258" stroke-width="1.6"/></marker><marker id="purple" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#7160a8" stroke-width="1.6"/></marker><marker id="gray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1 L8 4.5 L1 8" fill="none" stroke="#6b8076" stroke-width="1.6"/></marker></defs>
<rect x="1" y="1" width="998" height="718" rx="16" fill="#fcfdfb" stroke="#dfe8e1"/>
<g font-family="Inter,system-ui,sans-serif"><text x="32" y="36" font-size="12" font-weight="650" letter-spacing="1.3" fill="#677b6d">WORK-ORDER HANDOFF &amp; UPDATES</text>
<text x="968" y="36" text-anchor="end" font-size="12" fill="#677b6d">Time flows downward ↓</text>
