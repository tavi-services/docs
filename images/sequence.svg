t-anchor="middle" font-size="11" font-weight="650" fill="#60776a">6</text><rect x="183.0" y="529" width="294" height="25" rx="4" fill="#fcfdfb"/><text x="330.0" y="546" text-anchor="middle" font-size="16" font-weight="600" fill="#294d3b">Fetch latest work order</text><path d="M160 558 H500" fill="none" stroke="#167258" stroke-width="2"  marker-end="url(#green)"/><text x="330.0" y="578" text-anchor="middle" font-size="12" fill="#63796b">GET /jobs/client/{job_id}</text><circle cx="40" cy="627" r="12" fill="#e5ece6"/><text x="40" y="631" text-anchor="middle" font-size="11" font-weight="650" fill="#60776a">7</text><rect x="183.0" y="599" width="294" height="25" rx="4" fill="#fcfdfb"/><text x="330.0" y="616" text-anchor="middle" font-size="16" font-weight="600" fill="#294d3b">Return current state</text><path d="M500 628 H160" fill="none" stroke="#6b8076" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#gray)"/><text x="330.0" y="648" text-anchor="middle" font-size="12" fill="#63796b">Status · visit · next action</text><path d="M32 672 H968" stroke="#dfe8e1"/><path d="M40 695 H75" stroke="#167258" stroke-width="2"/><text x="85" y="699" font-size="12" fill="#63796b">Request / action</text><path d="M265 695 H300" stroke="#6b8076" stroke-width="2" stroke-dasharray="5 4"/><text x="310" y="699" font-size="12" fill="#63796b">Response / update</text><path d="M515 695 H550" stroke="#7160a8" stroke-width="2"/><text x="560" y="699" font-size="12" fill="#63796b">Asynchronous webhook</text></g></svg>