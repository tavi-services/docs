<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title">
  <title id="title">Your platform files work orders with the Tavi Client API and reads their status; Tavi coordinates the visit with the on-site contact and the provider</title>
  <style>
    text { font-family: "Instrument Sans", system-ui, sans-serif; fill: #001D56; }
    .head { font-size: 20px; font-weight: 600; }
    .sub { font-size: 14px; fill: #4A5B7D; }
    .label { font-size: 14px; font-weight: 500; }
    .box { fill: #FFFFFF; stroke: #001D56; stroke-width: 2; }
    .tavi { fill: #F3EEFF; stroke: #001D56; stroke-width: 2; }
    .arrow { stroke: #001D56; stroke-width: 2; fill: none; marker-end: url(#head); }
    .dashed { stroke-dasharray: 6 5; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#001D56"/>
    </marker>
  </defs>

  <rect class="box" x="20" y="90" width="200" height="120" rx="14"/>
  <text class="head" x="120" y="140" text-anchor="middle">Your platform</text>
  <text class="sub" x="120" y="166" text-anchor="middle">Collects the request</text>

  <rect class="tavi" x="380" y="90" width="200" height="120" rx="14"/>
  <text class="head" x="480" y="140" text-anchor="middle">Tavi</text>
  <text class="sub" x="480" y="166" text-anchor="middle">Sources, prices, schedules</text>

  <rect class="box" x="720" y="20" width="220" height="100" rx="14"/>
  <text class="head" x="830" y="64" text-anchor="middle">On-site contact</text>
  <text class="sub" x="830" y="90" text-anchor="middle">Access and sign-off</text>

  <rect class="box" x="720" y="180" width="220" height="100" rx="14"/>
  <text class="head" x="830" y="224" text-anchor="middle">Provider</text>
  <text class="sub" x="830" y="250" text-anchor="middle">Vetted technician</text>

  <path class="arrow" d="M224 128 H376"/>
  <text class="label" x="300" y="116" text-anchor="middle">File work order</text>
  <path class="arrow" d="M376 176 H224"/>
  <text class="label" x="300" y="200" text-anchor="middle">Read status</text>

  <path class="arrow dashed" d="M584 120 L716 74"/>
  <text class="label" x="636" y="80" text-anchor="middle">Calls, texts</text>
  <path class="arrow dashed" d="M584 180 L716 226"/>
  <text class="label" x="636" y="240" text-anchor="middle">Dispatch, pay</text>
</svg>
