<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 255" role="img" aria-labelledby="title"><title id="title">Updates flow from Tavi to your backend and then to your customer app</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#70887e" stroke-width="1.3"/></marker></defs><rect width="960" height="255" rx="16" fill="#f5f8f5"/><path d="M195 112 L270 112" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M440 112 L515 112" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><path d="M685 112 L760 112" stroke="#70887e" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/><rect x="25" y="75" width="170" height="75" rx="10" fill="#0b6753" stroke="#0b6753"/><text x="110.0" y="106.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#ffffff">Tavi</text><text x="110.0" y="130.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#ffffff">Records job change</text><rect x="270" y="75" width="170" height="75" rx="10" fill="#ffffff" stroke="#d4dfd6"/><text x="355.0" y="106.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#263c32">Tavi sends</text><text x="355.0" y="130.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#263c32">Signed JSON update</text><rect x="515" y="75" width="170" height="75" rx="10" fill="#ffffff" stroke="#d4dfd6"/><text x="600.0" y="106.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#263c32">Your backend</text><text x="600.0" y="130.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#263c32">Checks + saves</text><rect x="760" y="75" width="175" height="75" rx="10" fill="#e2f0e7" stroke="#bdd5c5"/><text x="847.5" y="106.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="650" fill="#164c3a">Your app</text><text x="847.5" y="130.5" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" font-weight="400" fill="#164c3a">Shows the update</text><text x="25" y="35" fill="#53675e" font-family="system-ui,sans-serif" font-size="14" font-weight="600">UPDATE FLOW: TAVI → YOUR BACKEND → YOUR APP</text><text x="25" y="210" fill="#53675e" font-family="system-ui,sans-serif" font-size="14" font-weight="600">Your backend requests the latest job from Tavi if an update is missing.</text></svg>